version: "3.9"

# ==============================================================
#  FaceInsight – docker-compose.yml
#  Windows / Docker Desktop compatible
#  Run: docker-compose up --build
# ==============================================================

networks:
  faceinsight_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  media_uploads:
  media_processed:
  ml_weights:
  qdrant_data:

services:

  # ─────────────────────────────────────────
  # 1. PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: faceinsight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # expose for local DB tools (TablePlus, DBeaver)
    networks:
      - faceinsight_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2. Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: faceinsight_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - faceinsight_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # 2.5 Qdrant
  # ─────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: faceinsight_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - faceinsight_net

  # ─────────────────────────────────────────
  # 3. FastAPI Backend
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceinsight_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:   postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER:  redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      PYTHONPATH:     /app
    volumes:
      - ./backend:/app                   # hot-reload in dev
      - media_uploads:/app/media/uploads
      - media_processed:/app/media/processed
      - ml_weights:/app/ml/weights       # shared with workers
    ports:
      - "8000:8000"
    networks:
      - faceinsight_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level info
      "

  # ─────────────────────────────────────────
  # 4. Celery Worker  (ML heavy lifting)
  # ─────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceinsight_celery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:   postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER:  redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      PYTHONPATH:     /app
    volumes:
      - ./backend:/app
      - media_uploads:/app/media/uploads
      - media_processed:/app/media/processed
      - ml_weights:/app/ml/weights
    networks:
      - faceinsight_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # concurrency=2 safe for Windows Docker Desktop RAM limits
    command: >
      celery -A workers.celery_app worker
        --loglevel=info
        --concurrency=2
        --queues=ml_queue,default
        --hostname=worker@%h

  # ─────────────────────────────────────────
  # 5. Celery Beat  (scheduled tasks)
  # ─────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faceinsight_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:   postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER:  redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      PYTHONPATH:     /app
    volumes:
      - ./backend:/app
    networks:
      - faceinsight_net
    depends_on:
      - redis
      - postgres
    command: >
      celery -A workers.celery_app beat
        --loglevel=info
        --scheduler redbeat.RedBeatScheduler

