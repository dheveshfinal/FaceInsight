# ==============================================================
#  FaceInsight – alembic.ini
#  Alembic configuration file
# ==============================================================

[alembic]
# path to migration scripts (relative to this file / workdir /app)
script_location = database/migrations

# template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path insertion
prepend_sys_path = .

# timezone for revision filenames
timezone = UTC

# max length of slug
truncate_slug_length = 40

# version location — single directory
version_locations = %(here)s/database/migrations/versions

# version path separator — use os default (\ on Windows, / on POSIX)
version_path_separator = os

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# DATABASE_URL is injected from env by env.py — leave blank here
sqlalchemy.url =


# ── Logging configuration ──────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
