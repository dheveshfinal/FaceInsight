; ==============================================================
;  FaceInsight – backend/supervisord.conf
;  supervisord manages both Uvicorn and Celery independently.
;  If either crashes, only THAT process is restarted.
;  SIGTERM to supervisord does NOT cascade to both children.
; ==============================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ── Uvicorn (FastAPI) ─────────────────────────────────────────
[program:uvicorn]
command=uvicorn main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Celery Worker ─────────────────────────────────────────────
[program:celery]
command=celery -A workers.celery_app worker -Q celery,ml_queue,default --loglevel=info --concurrency=1 --max-tasks-per-child=10
directory=/app
autostart=true
autorestart=true
startretries=10
startsecs=10
stopwaitsecs=60
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
