# ==============================================================
#  FaceInsight – Render Deployment Configuration (Fixed)
#  For deploying backend to Render.com
# ==============================================================

services:
  # ── PostgreSQL Database ────────────────────────────────────
  - type: pserv
    name: faceinsight-postgres
    image: postgres:16
    region: oregon
    plan: standard
    envVars:
      - key: POSTGRES_USER
        value: faceinsight
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        value: faceinsight_db
      - key: POSTGRES_INITDB_ARGS
        value: "-c max_connections=200"

  # ── Redis Cache/Queue ─────────────────────────────────────
  - type: pserv
    name: faceinsight-redis
    image: redis:7-alpine
    region: oregon
    plan: standard

  # ── Qdrant Vector Database ────────────────────────────────
  - type: pserv
    name: faceinsight-qdrant
    image: qdrant/qdrant:latest
    region: oregon
    plan: standard
    disks:
      - name: qdrant-storage
        mountPath: /qdrant/storage
        sizeGB: 10

  # ── FastAPI Backend ───────────────────────────────────────
  - type: web
    name: faceinsight-api
    runtime: docker
    region: oregon
    plan: standard
    repo: https://github.com/dheveshfinal/faceinsight
    dockerfilePath: backend/Dockerfile
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PORT
        value: 8000
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromService:
          name: faceinsight-postgres
          property: databaseURL
      - key: REDIS_URL
        value: redis://faceinsight-redis:6379
      - key: CELERY_BROKER
        value: redis://faceinsight-redis:6379/0
      - key: CELERY_BACKEND
        value: redis://faceinsight-redis:6379/1
      - key: QDRANT_URL
        value: http://faceinsight-qdrant:6333
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://your-vercel-app.vercel.app
      - key: ALLOWED_HOSTS
        value: faceinsight-api.onrender.com,localhost
      - key: ML_DEVICE
        value: cpu
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
    
    healthCheckPath: /api/v1/health

  # ── Celery Worker (Background Tasks) ───────────────────────
  - type: background_worker
    name: faceinsight-celery
    runtime: docker
    region: oregon
    plan: standard
    repo: https://github.com/dheveshfinal/faceinsight
    dockerfilePath: backend/Dockerfile
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && celery -A workers.celery_app worker --loglevel=info --concurrency=2
    
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          name: faceinsight-postgres
          property: databaseURL
      - key: REDIS_URL
        value: redis://faceinsight-redis:6379
      - key: CELERY_BROKER
        value: redis://faceinsight-redis:6379/0
      - key: CELERY_BACKEND
        value: redis://faceinsight-redis:6379/1
      - key: QDRANT_URL
        value: http://faceinsight-qdrant:6333
      - key: GROQ_API_KEY
        sync: false
      - key: ML_DEVICE
        value: cpu
