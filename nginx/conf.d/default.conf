# ==============================================================
#  FaceInsight – nginx/conf.d/default.conf
#  Routes:
#    /api/v1/*  → FastAPI backend:8000
#    /ws/*      → FastAPI backend:8000  (WebSocket upgrade)
#    /*         → Flutter web flutter_web:3000
# ==============================================================

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream flutter {
    server flutter_web:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;

    # ── API proxy ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket proxy ────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;    # keep WS alive during long analysis
        proxy_send_timeout 3600s;
    }

    # ── Media files (uploads) ──────────────────────────────────
    location /media/ {
        alias  /media/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Security: only serve image types
        location ~* \.(jpg|jpeg|png|webp)$ {
            add_header X-Content-Type-Options nosniff;
        }
        location ~* ^(?!.*\.(jpg|jpeg|png|webp)$) {
            return 403;
        }
    }

    # ── Flutter Web (SPA catch-all) ────────────────────────────
    location / {
        proxy_pass         http://flutter;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # SPA fallback – if asset 404, serve index.html
        proxy_intercept_errors on;
        error_page 404 = @flutter_fallback;
    }

    location @flutter_fallback {
        proxy_pass http://flutter;
        proxy_set_header Host $host;
    }
}